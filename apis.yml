aid: trace
name: Trace
description: Trace (tracehq.com) is a workforce planning, headcount management, and
  procurement platform where companies plan and manage headcount as their most important
  investment, offering instant workforce analytics and headcount planning. Trace was
  backed by 500 Global and Uncork Capital, was acquired by Paylocity (now branded
  "TraceHQ, A Paylocity Company"), and the standalone Trace app is being sunset in
  early 2026 as the product folds into Paylocity for Finance headcount planning. Trace
  publishes no public developer portal, API documentation, or SDKs.
